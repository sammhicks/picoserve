[package]
name = "request_info"
version = "0.1.0"
edition = "2024"
description = "A `MethodHandlerService` which reports information about the request."
categories = ["Tokio"]
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
picoserve = { path = "../../picoserve", features = ["log", "tokio"] }
pretty_env_logger = { workspace = true }
tokio = { workspace = true }
