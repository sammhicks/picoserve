[package]
name = "hello_world_single_thread"
version = "0.1.0"
edition = "2021"
description = "A minimal example showing how to set up a `Router`, running on a single thread."
categories = ["Tokio"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
picoserve = { path = "../../picoserve", features = ["log", "tokio"] }
pretty_env_logger = { workspace = true }
tokio = { workspace = true }
