[package]
name = "web_sockets"
version = "0.1.0"
edition = "2024"
description = "A long-lived connection both sending and receiving WebSocket messages."
categories = ["Tokio"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
pretty_env_logger = { workspace = true }
picoserve = { path = "../../picoserve", features = ["log", "tokio", "ws"] }
tokio = { workspace = true, features = ["sync"] }
