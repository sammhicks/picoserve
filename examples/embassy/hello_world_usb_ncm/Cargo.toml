[package]
name = "hello_world_usb_ncm"
version = "0.1.0"
edition = "2021"
description = "A minimal example showing how to set up a `Router` using USB CDC NCM as network interface."
categories = ["Embassy on Raspberry Pi Pico", ":pinned"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cortex-m-rt = { workspace = true }
cyw43 = { workspace = true }
cyw43-pio = { workspace = true }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-net = { workspace = true }
embassy-rp = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
embassy-usb-logger = { workspace = true }
embassy-usb = { workspace = true }
embassy-usb-host = { workspace = true }
embassy-usb-driver = { workspace = true }
log = { workspace = true }
panic-persist = { workspace = true }
picoserve = { workspace = true }
portable-atomic = { workspace = true }
rand = { workspace = true }
static_cell = { workspace = true }
example_secrets = { path = "../example_secrets" }
example_utils = { path = "../example_utils" }