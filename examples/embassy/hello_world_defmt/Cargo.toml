[package]
name = "hello_world_defmt"
version = "0.1.0"
edition = "2024"
description = "A minimal example showing how to set up a `Router` using a debugger and defmt for logging."
categories = ["Embassy on Raspberry Pi Pico"]
publish = false

# 
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "hello_world_defmt"
test = false
bench = false

[dependencies]
cortex-m-rt = "0.7.6"
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["nightly", "platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["icmp", "auto-icmp-echo-reply", "udp", "tcp", "proto-ipv4", "medium-ethernet"] }
embassy-rp = { version = "0.10.0", features = ["critical-section-impl", "time-driver", "rp2040"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
picoserve = { path = "../../../picoserve", features = ["embassy", "defmt"] }
portable-atomic = { version = "1.15.0", features = ["critical-section"], default-features = false }
rand = { version = "0.9.5", default-features = false }
static_cell = { version = "2.1.1", features = ["nightly"] }
example_secrets = { path = "../example_secrets" }
example_utils = { path = "../example_utils", default-features = false, features = ["defmt"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"