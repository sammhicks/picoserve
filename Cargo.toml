[workspace]
resolver = "3"
members = [
    "picoserve",
    "picoserve_derive",
    "examples/chunked_response",
    "examples/conditional_routing",
    "examples/custom_extractor",
    "examples/form",
    "examples/query",
    "examples/graceful_shutdown",
    "examples/graceful_shutdown_server_sent_events",
    "examples/graceful_shutdown_web_sockets",
    "examples/hello_world",
    "examples/hello_world_single_thread",
    "examples/huge_requests",
    "examples/json_maps",
    "examples/layers",
    "examples/nested_router",
    "examples/path_parameters",
    "examples/request_info",
    "examples/response_using_state",
    "examples/routing_fallback",
    "examples/server_sent_events",
    "examples/state",
    "examples/state_local",
    "examples/state_multiple",
    "examples/static_content",
    "examples/web_sockets",
]
exclude = [
    "examples/embassy",
]

[workspace.dependencies]
anyhow = "1.0.104"
futures-util = "0.3.31"
heapless = { version = "0.9.3", features = ["serde"] }
log = "0.4.34"
pretty_env_logger = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = { version = "2.0.20", default-features = false }
tokio = { version = "1.53.1", features = ["rt", "io-util", "net", "time", "macros"] }

# temporary patches to use updated embassy
[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-usb-host = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
embassy-usb-logger = { git = "https://github.com/embassy-rs/embassy", rev = "7330106" }
